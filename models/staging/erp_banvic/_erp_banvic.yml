sources:
  - name: erp
    description: Esse é o sistema ERP da Banvic com dados de clientes, colaboradores, contas e transações.
    database: dev
    schema: erp_banvic
    tables:
      - name: localidades
        description: Tabela fonte de localidades com informações de cidade e estado.
        columns:
          - name: COD_LOCALIDADE
            data_tests:
              - unique
              - not_null
      - name: clientes
        description: Tabela fonte de clientes com informações pessoais de cada cliente da Banvic.
        columns:
          - name: COD_CLIENTE
            data_tests:
              - unique
              - not_null
      - name: agencias
        description: Tabela fonte com o cadastro de agências da Banvic.
        columns:
          - name: COD_AGENCIA
            data_tests:
              - unique
              - not_null
      - name: colaboradores
        description: Tabela fonte com o cadastro e informações de colaboradores da Banvic.
        columns:
          - name: COD_COLABORADOR
            data_tests:
              - unique
              - not_null
      - name: colaborador_agencia
        data_tests:
        - dbt_utils.unique_combination_of_columns:
            arguments:
              combination_of_columns:
              - cod_colaborador
              - cod_agencia
      - name: contas
        description: Tabela que armazena os dados das contas correntes dos clientes, incluindo agência, tipo de conta, saldo e data de abertura.
        columns:
          - name: num_conta
            data_tests:
              - unique
              - not_null

      - name: propostas_credito
        description: Tabela que armazena as propostas de crédito feitas aos clientes, incluindo dados como taxa de juros, valor da proposta, valor financiado, parcelas e status.
        columns:
          - name: cod_proposta
            data_tests:
              - unique
              - not_null

      - name: transacoes
        description: Tabela que registra as transações realizadas nas contas dos clientes, incluindo tipo da transação, valor e data da transação.
        columns:
          - name: cod_transacao
            data_tests:
              - unique
              - not_null
